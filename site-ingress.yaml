apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-site-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: mysite.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-site-svc
            port:
              number: 80